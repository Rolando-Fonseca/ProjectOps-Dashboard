# Despliegue continuo: cada push a main publica el build en GitHub Pages.
# La app usa el mock backend embebido (environment.useMockApi), así que la
# demo funciona sin servidor.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base-href /ProjectOps-Dashboard/
      # SPA fallback: GitHub Pages sirve 404.html para rutas profundas (/tasks, /projects/:id)
      - run: cp dist/project-ops/browser/index.html dist/project-ops/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/project-ops/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
